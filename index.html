/* Concepto: cabina de recreativa nocturna. Escenario 16:9 con menús superpuestos; controles táctiles debajo en móvil. */
:root{
  --bg:#0d0a1f; --panel:#1a1436; --panel2:#2a2056; --line:#43377f;
  --fg:#f5efe3; --mute:#a99fcf; --acc:#ffc233; --hot:#ff4d3a; --teal:#2ee6c5;
  --f-d:'Bungee','Impact',sans-serif; --f-b:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-b);font-size:18px;font-weight:500;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--line);border-radius:6px;overflow:hidden}
#c:focus{outline:none}
#c{display:block;width:100%;height:100%;background:#000}
#ui{position:absolute;inset:0;overflow:auto;display:flex;padding:clamp(10px,2.5%,26px);gap:clamp(12px,3%,36px);background:linear-gradient(90deg,rgba(13,10,31,.92) 0,rgba(13,10,31,.55) 60%,rgba(13,10,31,.2))}
#ui[hidden]{display:none!important}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero{flex:1 1 45%;justify-content:center}
.side{flex:1 1 55%;justify-content:center;max-width:520px}
.wide{flex:1;justify-content:flex-start}
h1{font:400 clamp(30px,6vw,64px)/.95 var(--f-d);margin:0;color:var(--acc);text-shadow:3px 3px 0 var(--hot);text-wrap:balance}
h2{font:400 clamp(20px,3vw,30px)/1 var(--f-d);margin:0;color:var(--acc);text-wrap:balance}
p{margin:0;color:var(--mute);line-height:1.25}
.btn{font:700 20px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:9px 14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn:hover,.btn:focus-visible{background:var(--acc);color:#1b1230;border-color:var(--acc);outline:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}.btn[disabled]:hover{background:var(--panel);color:var(--fg);border-color:var(--line)}
.btn small{font:600 14px var(--f-b);opacity:.8;letter-spacing:.04em}
.btn.on{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 90px;justify-content:center;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card canvas{width:100%;height:auto;background:var(--panel2);border-radius:3px}
.card b{font:400 13px var(--f-d);color:var(--acc)}
.card span{font-size:15px;color:var(--mute);line-height:1.15}
.tag{font:700 13px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:17px}.keys b{color:var(--acc)}
.slider{display:flex;align-items:center;gap:10px}.slider input{flex:1;accent-color:var(--acc)}
#touch{display:none;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
#touch[hidden]{display:none!important}
@media (pointer:coarse){#touch{display:flex}}
#touch.show{display:flex}
#touch .pad,#touch .acts{display:grid;gap:6px}
#touch .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
#touch .acts{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px)}
#touch button{font:700 18px var(--f-b);color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:50%;touch-action:none}
#touch button.on{background:var(--acc);color:#1b1230}
.hint{font-size:15px;color:var(--mute)}
@media (max-width:720px){
  #stage.inmenu{aspect-ratio:auto;min-height:560px}
  #stage.inmenu canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #stage.inmenu #ui{position:relative;inset:auto;flex-direction:column;min-height:560px}
  .side{max-width:none}
}

.sel{display:grid;grid-template-columns:150px 1fr;gap:12px;min-width:0}
.thumbs{display:flex;flex-direction:column;gap:6px}
.thumb{display:flex;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:4px;color:var(--fg);text-align:left;cursor:pointer;font:700 18px var(--f-b)}
.thumb canvas{width:44px;height:54px;border-radius:2px;flex:none}
.thumb small{display:block;font-size:13px;color:var(--mute);font-weight:600}
.thumb.on,.thumb:focus-visible{border-color:var(--acc);background:var(--panel2);outline:none}
.detail{display:grid;grid-template-columns:190px 1fr;gap:14px;min-width:0}
.bigp{border:2px solid var(--acc);border-radius:4px;overflow:hidden;align-self:start}
.bigp canvas{display:block;width:100%;height:auto}
.statrow{display:grid;grid-template-columns:78px 1fr 46px;gap:8px;align-items:center;font-size:16px}
.statrow b{text-align:right}
.bar{height:10px;background:#0007;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.skills{max-height:128px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:15px;line-height:1.15;padding-right:4px}
.sk{display:grid;grid-template-columns:46px 1fr;gap:6px}.sk>b{color:var(--acc)}.sk.lock{opacity:.45}
label.btn{cursor:pointer}
@media (max-width:720px){.sel{grid-template-columns:1fr}.thumbs{flex-direction:row;flex-wrap:wrap}.thumb{flex:1 1 130px}.detail{grid-template-columns:1fr}.bigp{max-width:200px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

function nextWave(){

  let boss=false,bi=ch;
  if(m==='story'){if(G.lv.locks.length>1?G.lockIdx===G.lv.locks.length-1:G.wave===WAVES(ch)+1)boss=true}
  else if(G.wave%5===0){boss=true;bi=(G.wave/5-1)%11}
  G.bossWave=boss;
  if(boss){
    const b=mkBoss(bi);b.hp*=m==="arcade"?1+G.wave*.02:1;b.maxhp=b.hp;G.en.push(b);G.boss=b;S.boss();
    G.banner={t:130,txt:'¡JEFE!',sub:b.name};
  }else{
    const n=m==='arcade'?Math.min(12,3+Math.floor(G.wave*.9)):3+Math.floor(ch/2)+G.wave;
    const pool=['grunt','grunt','fast','ranged','tank','grabber'].slice(0,m==='arcade'?Math.min(6,2+Math.floor(G.wave/2)):Math.min(6,2+Math.floor(ch/1.6)+Math.min(2,G.wave-1)));
    G.queue=[];for(let i=0;i<n;i++)G.queue.push(pick(pool));
    G.banner={t:100,txt:m==='arcade'?'OLEADA '+G.wave:'OLEADA '+G.wave+'/'+(G.lv.locks.length>1?G.lv.locks.length-1:WAVES(ch)),sub:''};
    const ws=Object.keys(WPN);

    if(Math.random()<.3)G.items.push({k:'food',x:G.cx+rnd(120,W-120),y:rnd(Y0+20,Y1-10),heal:20});
    if(G.wave>1&&Math.random()<.25)G.items.push({k:'star',x:G.cx+rnd(120,W-120),y:rnd(Y0+20,Y1-10)});

function updFlow(){
  if(G.state==='intro'){if(--G.sT<=0)nextWave();return}
  if(G.state==='advance'){const tgt=G.lv.locks[G.lockIdx+1];G.cx=clamp(Math.max(G.cx,G.p.x-W*.45),G.cx,tgt);if(G.cx>=tgt-.5){G.cx=tgt;G.lockIdx++;nextWave()}return}

  if(G.state!=='fight')return;
  if(G.queue.length&&G.t%38===0&&G.en.filter(e=>!e.dying).length<(G.mode==='arcade'?5:4)){G.en.push(mkEnemy(G.queue.shift(),Math.random()<.5?-1:1))}
  if(!G.queue.length&&G.en.length===0){

    if(G.mode==='arcade')G.p.hp=Math.min(G.p.maxhp,G.p.hp+10);
  }
}

};
A.cur=A.main;
ui.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const f=A[b.dataset.do];if(f){S.pick();f(b.dataset.a,b)}});
ui.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('.thumb');if(t&&+t.dataset.a!==sel)showDetail(+t.dataset.a)});
ui.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.thumb');if(t&&+t.dataset.a!==sel)showDetail(+t.dataset.a)});
ui.addEventListener('dblclick',e=>{if(e.target.closest&&e.target.closest('.thumb'))A.play()});
ui.addEventListener('change',e=>{
  if(e.target.id!=='pf'||!e.target.files[0])return;
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    const k=document.createElement('canvas');k.width=240;k.height=300;const g=k.getContext('2d'),r=Math.max(240/im.width,300/im.height);
    g.drawImage(im,(240-im.width*r)/2,(300-im.height*r)/2,im.width*r,im.height*r);
    const id=CHARS[sel].id;photos[id]=k.toDataURL('image/jpeg',.82);delete imgCache[id];savePhotos();A.charsel()};im.src=fr.result};
  fr.readAsDataURL(e.target.files[0]);
});
function showResult(win,rank){
  const m=G.mode,c=save.chars[G.p.c.id],last=G.ch>=10;
  let title,body,btns;
  if(m==='story'){
    title=win?(last?'¡Barrio liberado!':'¡Capítulo '+(G.ch+1)+' superado!'):'Derrota';
    body=win?`<p>Jefe derrotado: <b style="color:var(--acc)">${esc(CH[G.ch].boss)}</b></p><p>Rango <b style="color:var(--teal);font-size:28px">${rank}</b> · ${G.score} puntos · ${Math.round(G.time/60)} s</p>`:`<p>Los del barrio te han ganado esta vez. Puntos: ${G.score}</p>`;
    body+=win?`<p>Bonus de capítulo: +${G.bonus} XP</p>`:'';
    btns=(win&&!last?`<button class="btn" data-do="start" data-a="${G.ch+1}">Siguiente capítulo</button>`:'')+`<button class="btn" data-do="start" data-a="${G.ch}">${win?'Repetir':'Reintentar'}</button>`;
  }else{
    title='Fin del Arcade';body=`<p>Llegaste a la oleada <b style="color:var(--acc)">${G.wave}</b> con ${G.score} puntos${G.score>=save.arcadeBest?' · ¡nuevo récord!':''}.</p><p>${G.kills} rivales derrotados · ${G.p.c.name} nivel ${c.lvl}</p>`;
    btns='<button class="btn" data-do="startArcade">Otra partida</button>';
  }
  const lv=G.learnedAll.length?`<p>Habilidades nuevas: <b style="color:var(--teal)">${G.learnedAll.map(esc).join(', ')}</b></p>`:'';
  screen(`<div class="col side"><h2>${title}</h2>${body}<p>${G.p.c.name} · nivel ${save.chars[G.p.c.id].lvl}</p>${lv}${btns}<button class="btn" data-do="change">Cambiar de personaje</button><button class="btn" data-do="main">Menú principal</button></div>`);
}
function pauseMenu(){
  G.menuOpen=true;ui.hidden=false;ui.innerHTML=`<div class="col side"><h2>Pausa</h2><button class="btn" data-do="resume">Continuar</button><button class="btn" data-do="restart">Reiniciar</button><button class="btn" data-do="quit">Salir al menú</button></div>`;
  ui.querySelector('button').focus();for(const k in keys)keys[k]=0;
}
function resume(){G.menuOpen=false;ui.hidden=true;ui.innerHTML='';for(const k in pressed)delete pressed[k]}
A.resume=resume;A.restart=()=>startGame(G.mode,G.ch);A.quit=()=>{G.run=false;touch.hidden=true;mode='menu';persist();A.main()};
requestAnimationFrame(loop);
A.main();
</script>

</body></html>
